kind = "web"
previewPath = "/"
title = "LEGENDLEO Gamehub"
version = "1.0.0"
id = "artifacts/gamehub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19931

[services.development]
run = "pnpm --filter @workspace/gamehub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gamehub", "run", "build" ]
serve = "static"
publicDir = "artifacts/gamehub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19931"
BASE_PATH = "/"
